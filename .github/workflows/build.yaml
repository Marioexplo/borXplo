name: Build and attach to release

permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v3
        with:
          python-version: "3.13"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt

      - name: Build
        run: pyinstaller borXplo.spec -y

      - name: Get package name
        id: pack
        run: echo "name=borxplo-$(cat package/version.txt).tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          mkdir -p root/usr/share/man/man1
          mkdir root/usr/share/man/man5
          mkdir root/usr/bin
          mkdir root/opt
          mkdir licenses

          cp -r dist/borxplo root/opt
          cp -P package/bin_link root/usr/bin/borxplo

          gzip -9 mans/* -k
          cp mans/borxplo.1.gz root/usr/share/man/man1
          cp mans/borxplo.5.gz root/usr/share/man/man5

          cp -r LICENSE package/third-party-licenses licenses

          tar -czf ${{ steps.pack.outputs.name }} root licenses

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.name }}
